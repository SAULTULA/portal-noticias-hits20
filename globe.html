        function useEarthTextures() {
            const [state, setState] = useState({ ready: false, day: null, night: null, clouds: null });

                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                const result = { day: null, night: null, clouds: null };
                let pending = 3;
                let settled = false;
                const settle = () => { if (!settled) { settled = true; setState({ ready: true, ...result }); } };
                const done = () => { pending--; if (pending <= 0) settle(); };
                loader.load(TEX_URLS.day, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; result.day = t; done(); }, undefined, () => { done(); });
                loader.load(TEX_URLS.night, (t) => { t.colorSpace = THREE.SRGBColorSpace; result.night = t; done(); }, undefined, () => { done(); });
                loader.load(TEX_URLS.clouds, (t) => { result.clouds = t; done(); }, undefined, () => { done(); });

                return () => { settled = true; clearTimeout(timeout); };
            }, []);
            return state;

                    vec3 color;
                    if (hasNight > 0.5) {

                        color = mix(nightColor, dayColor, dayFactor);
                    } else {
                        color = dayColor * (0.18 + 0.82 * dayFactor);
                    }
                    gl_FragColor = vec4(color, 1.0);
                }
            `
                });
            }, [tex.day, tex.night]);
        }

        const Earth = memo(({ visitors, userLoc, tex }) => {
            const groupRef = useRef();
            const cloudsRef = useRef();
            const earthMat = useEarthMaterial(tex);

            useFrame((_, delta) => {
                if (groupRef.current) groupRef.current.rotation.y += delta * 0.03;
                if (cloudsRef.current) cloudsRef.current.rotation.y += delta * 0.045;
            });

            const recentVisitors = visitors.slice(0, 4);

            return (
                <>
                    <group ref={groupRef}>
                        {earthMat ? (
                            <mesh material={earthMat}><sphereGeometry args={[2, 96, 96]} /></mesh>
                        ) : (
                            <mesh><sphereGeometry args={[2, 64, 64]} /><meshPhongMaterial color="#1a4d8f" emissive="#001133" specular="#222" shininess={15} /></mesh>
                        )}
                        {visitors.map(v => <Marker key={v.id} lat={v.lat} lng={v.lng} user={false} />)}
                        {userLoc && <Marker lat={userLoc.lat} lng={userLoc.lng} user={true} />}
                        {userLoc && <PulseWave lat={userLoc.lat} lng={userLoc.lng} color="#00ff41" />}
                        {recentVisitors.map(v => <PulseWave key={'p' + v.id} lat={v.lat} lng={v.lng} color="#38bdf8" />)}
                    </group>
                    {tex.clouds && (
                        <mesh ref={cloudsRef} scale={[1.012, 1.012, 1.012]}>
                            <sphereGeometry args={[2, 48, 48]} />
                            <meshPhongMaterial map={tex.clouds} transparent opacity={0.6} depthWrite={false} blending={THREE.AdditiveBlending} />
                        </mesh>
                    )}
                    <Atmosphere />
                    <Stars radius={80} depth={40} count={3000} factor={3.5} saturation={0} fade speed={0.8} />
                </>
            );
        });

        const Loading3D = () => (
            <div className="absolute inset-0 z-30 flex items-center justify-center bg-black pointer-events-none">
                <div className="flex flex-col items-center gap-4">
                    <div className="loader-ring"></div>
                    <span className="text-blue-400 text-xs font-medium tracking-[0.3em] uppercase">Cargando Planeta</span>
                </div>
            </div>
        );

        const AnimatedNumber = memo(({ value }) => {
            const [display, setDisplay] = useState(value);
            const prev = useRef(value);
            useEffect(() => {
                const start = prev.current;
                const end = value;
                if (start === end) return;
                const duration = 700;
                const startTime = performance.now();
                let raf;
                const step = (now) => {
                    const t = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - t, 3);
                    setDisplay(Math.round(start + (end - start) * eased));
                    if (t < 1) raf = requestAnimationFrame(step);
                    else prev.current = end;
                };
                raf = requestAnimationFrame(step);
                return () => cancelAnimationFrame(raf);
            }, [value]);
            return <span className="tabular-nums">{display.toLocaleString('es')}</span>;
        });

        const Stat = memo(({ label, value, Icon, accent }) => (
            <div className="flex-1 flex flex-col items-center py-1.5 px-1 border-r border-white/5 last:border-0 min-w-0">
                <div className={`flex items-center gap-0.5 mb-0.5 ${accent || 'text-blue-400'}`}>
                    <Icon size={9} strokeWidth={2.5} />
                    <span className="text-[7px] font-bold uppercase tracking-wider truncate">{label}</span>
                </div>
                <span className="text-sm font-bold text-white leading-tight truncate"><AnimatedNumber value={value} /></span>
            </div>
        ));

        const ProvincePopup = ({ data, counts, onClose }) => (
            <motion.div
                initial={{ opacity: 0, y: 15, scale: 0.9 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                exit={{ opacity: 0, y: 15, scale: 0.9 }}
                transition={{ duration: 0.2 }}
                className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50"
            >
                <div className="glass rounded-xl w-56 overflow-hidden shadow-2xl">
                    <div className="px-3 py-2 flex justify-between items-center border-b border-white/10 bg-slate-800/40">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">{data.f}</span>
                            <span className="text-xs font-bold text-white">{data.n}</span>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-white p-0.5 rounded hover:bg-white/10 transition-colors"><X size={12} /></button>
                    </div>
                    <div className="p-2 max-h-40 overflow-y-auto scroll-thin space-y-1">
                        {Object.keys(data.p).map(pv => {
                            const c = counts[pv] || 0;
                            if (!c) return null;
                            return (
                                <div key={pv} className="flex justify-between items-center px-2 py-1.5 rounded-lg bg-white/[.04] text-[10px]">
                                    <span className="text-slate-200 truncate mr-2 font-medium">{pv}</span>
                                    <span className="font-mono font-bold text-cyan-300 bg-cyan-500/10 px-1.5 py-0.5 rounded">{c}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </motion.div>
        );

        const NationsPopover = ({ cCounts, onClose, onNationClick }) => {
            const allNations = useMemo(() =>
                COUNTRY_KEYS.map(code => ({ code, ...DB[code], count: cCounts[code] || 0 })).sort((a, b) => b.count - a.count),
                [cCounts]);
            const activeNations = allNations.filter(n => n.count > 0).length;

            return (
                <div className="absolute right-full top-1/2 -translate-y-1/2 mr-3 z-50">
                    <motion.div
                        initial={{ opacity: 0, x: 15, scale: 0.9 }}
                        animate={{ opacity: 1, x: 0, scale: 1 }}
                        exit={{ opacity: 0, x: 15, scale: 0.9 }}
                        transition={{ duration: 0.2, ease: 'easeOut' }}
                        style={{ transformOrigin: 'right center' }}
                        className="glass rounded-xl w-80 max-w-[85vw] overflow-hidden shadow-2xl relative"
                    >
                        <div className="popover-arrow"></div>
                        <div className="px-3 py-2.5 flex justify-between items-center border-b border-white/10 bg-gradient-to-r from-blue-900/40 to-cyan-900/40">
                            <div className="flex items-center gap-2">
                                <Globe2 size={15} className="text-blue-400" />
                                <span className="text-xs font-bold text-white tracking-wide">NACIONES</span>
                                <span className="text-[9px] font-mono text-blue-300 bg-blue-500/20 px-2 py-0.5 rounded-full border border-blue-500/30">{activeNations}/{allNations.length}</span>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded hover:bg-white/10 transition-colors"><X size={13} /></button>
                        </div>
                        <div className="p-2.5 max-h-[60vh] overflow-y-auto scroll-thin">
                            <div className="grid grid-cols-2 gap-1.5">
                                {allNations.map(nation => (
                                    <motion.button
                                        key={nation.code}
                                        whileHover={{ scale: 1.04 }}
                                        whileTap={{ scale: 0.96 }}
                                        onClick={() => onNationClick(nation.code)}
                                        className={`flex items-center gap-2 px-2 py-2 rounded-lg transition-all text-left ${nation.count > 0 ? 'bg-blue-500/10 hover:bg-blue-500/25 border border-blue-500/25' : 'bg-white/[.02] hover:bg-white/[.06] border border-transparent opacity-50'}`}
                                    >
                                        <span className="text-2xl drop-shadow-md select-none shrink-0">{nation.f}</span>
                                        <div className="flex-1 min-w-0">
                                            <p className="text-[10px] font-bold text-white truncate leading-tight">{nation.n}</p>
                                            <p className="text-[9px] font-mono text-cyan-300 leading-tight">{nation.count.toLocaleString('es')}</p>
                                        </div>
                                    </motion.button>
                                ))}
                            </div>
                        </div>
                    </motion.div>
                </div>
            );
        };

        // ─── Registro de visita real usando tu API de Gente de Medios ────────────────
        async function registrarVisitaReal(setStats, setVisitors, setCCounts, setPCounts) {
            try {
                // Se utiliza un proxy CORS (corsproxy.io) debido a que la API original rechaza peticiones de otros dominios (falta de Access-Control-Allow-Origin)
                const res = await fetch(`https://gente-de-medios.vercel.app/api/track?site_id=portal-noticias-hits20&t=${Date.now()}`);
                const data = await res.json();

                if (data.success) {
                    setStats({
                        day: data.stats.today || 0,
                        week: data.stats.week || 0,
                        month: data.stats.month || 0,
                        total: data.stats.total || 0
                    });

                    // Convertir las locaciones reales de la API en marcadores para el globo
                    const realVisitors = [];
                    const cc = {};
                    const pp = {};

                    let vId = 0;
                    if (data.stats.locations && Array.isArray(data.stats.locations)) {
                        data.stats.locations.forEach(loc => {
                            const code = (loc.code || 'AR').toUpperCase();
                            if (DB[code]) {
                                const country = DB[code];
                                cc[code] = (cc[code] || 0) + (loc.count || 1);

                                // Buscar si tenemos las coordenadas de la ciudad exacta
                                let cityMatch = Object.keys(country.p).find(c => {
                                    const cName = loc.city ? loc.city.toLowerCase() : '';
                                    return cName && c.toLowerCase() === cName;
                                });
                                // Si no la tenemos, usamos la primera ciudad (capital/principal)
                                if (!cityMatch) cityMatch = Object.keys(country.p)[0];

                                pp[cityMatch] = (pp[cityMatch] || 0) + (loc.count || 1);
                                const [lat, lng] = country.p[cityMatch];

                                // Agregar un marcador por cada visitante en esa ciudad (limitado visualmente a 5 por ciudad para no saturar)
                                const visualCount = Math.min(loc.count || 1, 5);
                                for (let i = 0; i < visualCount; i++) {
                                    realVisitors.push({
                                        id: ++vId,
                                        ck: code,
                                        cn: country.n,
                                        fl: country.f,
                                        pv: cityMatch,
                                        lat,
                                        lng
                                    });
                                }
                            }
                        });
                    }

                    setVisitors(realVisitors);
                    setCCounts(cc);
                    setPCounts(pp);

                    // Tomamos una locación al azar de los reales como el "userLoc" para el pulso verde
                    if (realVisitors.length > 0) {
                        return realVisitors[Math.floor(Math.random() * realVisitors.length)];
                    }
                }
            } catch (err) {
                console.warn('[GlobalNet] Error conectando con API:', err);
            }
            return null;
        }

        function App() {
            const [visitors, setVisitors] = useState([]);
            const [userLoc, setUserLoc] = useState(null);
            const [stats, setStats] = useState({ day: 0, week: 0, month: 0, total: 0 });
            const [cCounts, setCCounts] = useState({});
            const [pCounts, setPCounts] = useState({});
            const [selected, setSelected] = useState(null);
            const [showNations, setShowNations] = useState(false);
            const controlsRef = useRef();
            const tex = useEarthTextures();

            useEffect(() => {
                // Carga inicial de datos reales
                registrarVisitaReal(setStats, setVisitors, setCCounts, setPCounts).then(uloc => {
                    if (uloc) setUserLoc(uloc);
                });

                // Nota: Se ha eliminado el setInterval para evitar 
                // contar múltiples visitas cada 30 segundos (igual que el comportamiento nativo de la API).
            }, []);

            const handleNationClick = useCallback(code => setSelected(code), []);
            const handleCloseProvince = useCallback(() => setSelected(null), []);
            const toggleNations = useCallback(() => { setShowNations(p => !p); setSelected(null); }, []);
            const closeNations = useCallback(() => setShowNations(false), []);

            const zoomIn = useCallback(() => {
                if (controlsRef.current) {
                    const camera = controlsRef.current.object;
                    const dist = camera.position.length();
                    camera.position.normalize().multiplyScalar(Math.max(3, dist * 0.8));
                    controlsRef.current.update();
                }
            }, []);

            const zoomOut = useCallback(() => {
                if (controlsRef.current) {
                    const camera = controlsRef.current.object;
                    const dist = camera.position.length();
                    camera.position.normalize().multiplyScalar(Math.min(12, dist * 1.25));
                    controlsRef.current.update();
                }
            }, []);

            return (
                <div className="relative w-full h-screen bg-black">
                    <div className="absolute inset-0 z-0">
                        <Canvas camera={{ position: [0, 0.3, 5.2], fov: 45 }} dpr={[1, 2]} gl={{ antialias: true, powerPreference: 'high-performance' }}>
                            <ambientLight intensity={0.15} />
                            <directionalLight position={[5, 3, 5]} intensity={2.2} color="#ffffff" />
                            <pointLight position={[-8, -4, -6]} intensity={0.6} color="#3b82f6" />
                            <Earth visitors={visitors} userLoc={userLoc} tex={tex} />
                            <OrbitControls ref={controlsRef} enableZoom={true} enablePan={false} minDistance={2.8} maxDistance={12} zoomSpeed={0.6} rotateSpeed={0.5} minPolarAngle={Math.PI / 4} maxPolarAngle={Math.PI / 1.6} />
                        </Canvas>
                    </div>
                    {!tex.ready && <Loading3D />}
                    <div className="absolute right-3 top-1/2 -translate-y-1/2 z-20 flex flex-col items-end gap-1.5">
                        <button onClick={zoomIn} className="glass w-8 h-8 rounded-lg flex items-center justify-center text-blue-400 hover:text-white hover:bg-blue-500/20 transition-all active:scale-90" title="Acercar"><ZoomIn size={14} /></button>
                        <button onClick={zoomOut} className="glass w-8 h-8 rounded-lg flex items-center justify-center text-blue-400 hover:text-white hover:bg-blue-500/20 transition-all active:scale-90" title="Alejar"><ZoomOut size={14} /></button>
                        <div className="w-8 h-px bg-white/15 my-1"></div>
                        <div className="relative">
                            <button onClick={toggleNations} className={`btn-nations w-8 h-auto py-1.5 rounded-lg flex flex-col items-center justify-center gap-0.5 ${showNations ? 'active' : ''}`} title="Ver todas las naciones">
                                <Globe2 size={13} className="text-blue-200" />
                                <span className="text-[6px] font-bold text-white tracking-wider leading-none text-center">NACIONES</span>
                            </button>
                            <AnimatePresence>
                                {showNations && (<NationsPopover cCounts={cCounts} onClose={closeNations} onNationClick={handleNationClick} />)}
                            </AnimatePresence>
                        </div>
                    </div>
                    <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} className="absolute top-4 left-1/2 -translate-x-1/2 z-10">
                        <div className="glass rounded-full px-4 py-1.5 flex items-center gap-2">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
                            <span className="text-[10px] font-bold text-emerald-300 tracking-[0.2em] uppercase">Monitoreo en vivo</span>
                        </div>
                    </motion.div>
                    <motion.div initial={{ y: 60, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ delay: 0.3, type: 'spring', stiffness: 100 }} className="absolute bottom-2 left-0 right-0 z-10 flex justify-center px-1">
                        <div className="glass rounded-xl px-1 py-1 flex items-stretch w-full max-w-[280px]">
                            <Stat label="Hoy" value={stats.day} Icon={Clock} />
                            <Stat label="Semana" value={stats.week} Icon={Calendar} />
                            <Stat label="Mes" value={stats.month} Icon={TrendingUp} />
                            <Stat label="Total" value={stats.total} Icon={Users} accent="text-emerald-400" />
                        </div>
                    </motion.div>
                    <AnimatePresence>
                        {selected && DB[selected] && (<ProvincePopup data={DB[selected]} counts={pCounts} onClose={handleCloseProvince} />)}
                    </AnimatePresence>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>

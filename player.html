<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radio en Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #d9534f;
            object-fit: cover;
        }
        h3 { margin-bottom: 10px; color: #d9534f; }
        p { opacity: 0.85; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <img src="logo.png" alt="Logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect width=%22120%22 height=%22120%22 rx=%2260%22 fill=%22%23d9534f%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-size=%2216%22 font-weight=%22bold%22>RADIO</text></svg>'">
    <h3>Hits 20 Radio</h3>
    <p>Transmitiendo en Vivo</p>
    
    <!-- Mismo stream que usa el reproductor flotante del portal (index.html) -->
    <audio controls autoplay>
        <source src="https://stream.radiosmundiales.com/stream/claudio" type="audio/mpeg">
        Tu navegador no soporta el reproductor.
    </audio>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Radio en Vivo - Hits 20 Radio, San Luis, Argentina.">
    <title>Radio en Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #d9534f;
            object-fit: cover;
        }
        h3 { margin-bottom: 10px; color: #d9534f; }
        p { opacity: 0.85; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <!-- SEC-013: sin onerror inline complejo — se maneja via addEventListener en el script -->
    <img src="logo.png" alt="Logo Hits 20 Radio" id="logo-radio" loading="lazy">
    <h3>Hits 20 Radio</h3>
    <p>Transmitiendo en Vivo</p>
    
    <!-- Mismo stream que usa el reproductor flotante del portal (index.html) -->
    <audio controls autoplay>
        <source src="https://stream.radiosmundiales.com/stream/claudio" type="audio/mpeg">
        Tu navegador no soporta el reproductor.
    </audio>

    <script>
        // SEC-013: manejo de error de imagen via addEventListener
        const logoImg = document.getElementById('logo-radio');
        if (logoImg) {
            logoImg.addEventListener('error', function () {
                this.onerror = null;
                this.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' rx='60' fill='%23d9534f'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial' font-size='16' font-weight='bold'>RADIO</text></svg>";
            });
        }
    </script>
</body>
</html>

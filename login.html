<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Inicio de sesión para administradores del portal Hits 20 Radio.">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar Sesión - Hits 20 Radio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 350px;
        }
        .login-container h2 {
            margin-top: 0;
            text-align: center;
            color: #1a1a1a;
            border-bottom: 2px solid #d9534f;
            padding-bottom: 10px;
        }
        .login-field {
            margin-bottom: 15px;
        }
        .login-field label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .login-field input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-field--last {
            margin-bottom: 20px;
        }
        .btn-login {
            width: 100%;
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-login:hover {
            background: #c9302c;
        }
        .login-back {
            margin-top: 15px;
            text-align: center;
        }
        .login-back a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Acceso Admin</h2>
        
        <form id="form-login">
            <div class="login-field">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="username">
            </div>

            <div class="login-field login-field--last">
                <label for="clave">Contraseña:</label>
                <!-- BP-013: autocomplete="current-password" para password -->
                <input type="password" id="clave" name="clave" required autocomplete="current-password">
            </div>

            <!-- SEC-013: sin onmouseover/onmouseout inline — se maneja via CSS :hover -->
            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <div class="login-back">
            <a href="index.html">← Volver al Portal</a>
        </div>
    </div>

    <script>
        // Limpiamos sesión previa al entrar aquí
        sessionStorage.removeItem("auth");

        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const clave = document.getElementById('clave').value;

            // Tus datos de acceso
            if (usuario === "admin" && clave === "radio2026") {
                sessionStorage.setItem("auth", "true");
                window.location.href = "admin.html";
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        });
    </script>
</body>
</html>

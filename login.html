<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar Sesión - Hits 20 Radio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body style="background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 100%; max-width: 350px;">
        <h2 style="margin-top: 0; text-align: center; color: #1a1a1a; border-bottom: 2px solid #d9534f; padding-bottom: 10px;">Acceso Admin</h2>
        
        <form id="form-login">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem;">Usuario:</label>
                <input type="text" id="usuario" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem;">Contraseña:</label>
                <input type="password" id="clave" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; background: #d9534f; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background-color 0.2s ease;" onmouseover="this.style.background='#c9302c'" onmouseout="this.style.background='#d9534f'">Ingresar</button>
        </form>

        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.85rem;">← Volver al Portal</a>
        </div>
    </div>

    <script>
        // Limpiamos sesión previa al entrar aquí
        sessionStorage.removeItem("auth");

        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('usuario').value;
            const p = document.getElementById('clave').value;

            // Tus datos de acceso
            if (u === "admin" && p === "radio2026") {
                sessionStorage.setItem("auth", "true");
                window.location.href = "admin.html";
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        });
    </script>
</body>
</html>
